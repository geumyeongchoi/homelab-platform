# helm install kps prometheus-community/kube-prometheus-stack -n observability -f helm/values/kube-prometheus-stack.yaml
grafana:
  adminPassword: ${GRAFANA_ADMIN_PASSWORD}   # envsubst 로 주입, 저장소엔 플레이스홀더만
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: ["grafana.${DOMAIN}"]
    # TLS 는 앞단 프록시(NPM)가 종료. Traefik 을 80/443 에 직접 노출하는 서버라면 cert-manager 주석 + tls 블록 추가
  grafana.ini:
    server: { root_url: "https://grafana.${DOMAIN}", domain: "grafana.${DOMAIN}" }
  additionalDataSources:
    - { name: Loki,  type: loki,  url: http://loki.observability:3100,  access: proxy }
    - { name: Tempo, type: tempo, url: http://tempo.observability:3200, access: proxy,
        jsonData: { tracesToLogsV2: { datasourceUid: loki }, serviceMap: { datasourceUid: prometheus } } }
  sidecar: { dashboards: { enabled: true, label: grafana_dashboard } }   # docs/dashboards/*.json → ConfigMap
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
prometheus:
  prometheusSpec:
    retention: 5d
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }   # 8GB 서버 기준
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    enableRemoteWriteReceiver: true          # OTel Collector prometheusremotewrite 수신
    additionalScrapeConfigs:
      - job_name: k8s-pods-annotated       # prometheus.io/scrape=true 파드(docmind·flashgate /actuator/prometheus)
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: "(.+)"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: "([^:]+)(?::\\d+)?;(\\d+)"
            replacement: "$1:$2"
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
alertmanager:
  enabled: false                             # 8GB 서버: 알림은 Grafana 내장 alerting 사용
kubeStateMetrics: { resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } } }
prometheus-node-exporter: { resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } } }
