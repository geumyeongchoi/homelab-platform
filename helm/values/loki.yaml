# helm install loki grafana/loki -n observability -f helm/values/loki.yaml  (single binary, filesystem)
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - { from: "2024-04-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: loki_index_, period: 24h } }
  limits_config: { retention_period: 168h }
singleBinary:
  replicas: 1
  persistence: { size: 20Gi }
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
test: { enabled: false }
lokiCanary: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
