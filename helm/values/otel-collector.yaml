# helm install otel-collector open-telemetry/opentelemetry-collector -n observability -f helm/values/otel-collector.yaml
mode: deployment
image: { repository: otel/opentelemetry-collector-contrib }
fullnameOverride: otel-collector
resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
config:
  receivers:
    otlp: { protocols: { http: { endpoint: 0.0.0.0:4318 }, grpc: { endpoint: 0.0.0.0:4317 } } }
  processors:
    batch: {}
    memory_limiter: { check_interval: 1s, limit_mib: 256 }
    resource: { attributes: [{ key: deployment.environment, value: homelab, action: upsert }] }
  exporters:
    otlp/tempo: { endpoint: tempo.observability:4317, tls: { insecure: true } }
    prometheusremotewrite: { endpoint: http://kps-kube-prometheus-stack-prometheus.observability:9090/api/v1/write }
    otlphttp/loki: { endpoint: http://loki.observability:3100/otlp }
  service:
    pipelines:
      traces:  { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp/tempo] }
      metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheusremotewrite] }
      logs:    { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/loki] }
