image:
  repository: ghcr.io/geumyeongchoi/flashgate
  tag: 20260907-d35cfba          # CI 가 배포 시 덮어쓴다. latest 는 GC 플래그가 박힌 옛 이미지라 고정하지 않으면 'Multiple garbage collectors' 로 기동 실패
replicaCount: 1                       # 8GB 공유 서버(docmind Ollama 동거) 기준. 부하 측정 시 2 로 올린다
profile: sentinel
resources:                            # 8GB 서버 공유 기준. 벤치 시 일시적으로 상향
  requests: { cpu: 200m, memory: 512Mi }
  limits:   { cpu: "1",  memory: 768Mi }        # 512Mi 에서 OOMKilled(ZGC + OTel 에이전트). 힙 60% ≈ 460MB
jvm:
  opts: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -javaagent:/otel/opentelemetry-javaagent.jar"   # 작은 컨테이너: ZGC 는 메모리 오버헤드가 커서 제외
otel:
  serviceName: flashgate
  endpoint: http://otel-collector.observability:4318
  agentImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.15.0
probes:
  readiness: { path: /actuator/health/readiness, initialDelaySeconds: 10, periodSeconds: 3 }
  liveness:  { path: /actuator/health/liveness,  initialDelaySeconds: 30, periodSeconds: 10 }
terminationGracePeriodSeconds: 35     # server.shutdown=graceful 30s + 여유
pdb:
  minAvailable: 1
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3                     # 8GB 서버
  targetCPUUtilizationPercentage: 70
ingress:
  host: flash.<도메인>
  clusterIssuer: letsencrypt-prod
  tls: false                         # true = cert-manager 가 인증서 발급(Traefik 이 80/443 직접 노출할 때). false = 앞단 프록시가 TLS 종료
env:
  # RED 대시보드의 p50/p99 는 http_server_requests_seconds_bucket 을 쓴다 — Micrometer 는 기본적으로 버킷을 안 만든다.
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS: "true"
  MANAGEMENT_METRICS_DISTRIBUTION_SLO_HTTP_SERVER_REQUESTS: "5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s"
  REDIS_SENTINELS: redis-node-0.redis-headless.flashgate.svc.cluster.local:26379,redis-node-1.redis-headless.flashgate.svc.cluster.local:26379,redis-node-2.redis-headless.flashgate.svc.cluster.local:26379
  KAFKA_BOOTSTRAP: kafka.flashgate:9092
  DB_URL: jdbc:mysql://mysql.flashgate:3306/flashgate
  DB_USER: flashgate
existingSecret: flashgate-secrets    # DB_PASSWORD — 서버에서 kubectl create secret (또는 SealedSecret)
redis:
  enabled: true
  image: redis:7.4-alpine
  maxmemory: 64mb
  downAfterMs: 2000                   # 로컬 실측과 동일(README §3)
  resources: { requests: { cpu: 50m, memory: 48Mi }, limits: { memory: 128Mi } }
kafka:
  enabled: true
  image: apache/kafka:3.9.1
  heap: "-Xms256m -Xmx256m"
  storage: 2Gi
  resources: { requests: { cpu: 100m, memory: 320Mi }, limits: { memory: 512Mi } }
mysql:
  enabled: true
  image: mysql:8.4
  storage: 3Gi
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 448Mi } }
