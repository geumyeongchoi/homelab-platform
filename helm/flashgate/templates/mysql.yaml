{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata: { name: mysql }
spec: { selector: { app: mysql }, ports: [{ port: 3306 }], clusterIP: None }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql }
spec:
  serviceName: mysql
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          args: ["--innodb-buffer-pool-size=128M", "--performance-schema=OFF", "--skip-log-bin"]
          ports: [{ containerPort: 3306 }]
          env:
            - { name: MYSQL_DATABASE, value: flashgate }
            - { name: MYSQL_USER, value: {{ .Values.env.DB_USER | quote }} }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_PASSWORD } }
          resources: {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
          readinessProbe: { exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"] }, periodSeconds: 5 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: {{ .Values.mysql.storage }} } } }
{{- end }}
