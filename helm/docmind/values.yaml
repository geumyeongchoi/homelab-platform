image:
  repository: ghcr.io/geumyeongchoi/docmind
  tag: latest
replicaCount: 1
profile: private                     # private = 서버 안 Ollama(API 키 불필요, CPU 라 느림·소형 모델) / public = OpenAI(OPENAI_API_KEY 필요) / claude = Anthropic
resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits:   { cpu: "1",  memory: 768Mi }
jvm:
  opts: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -javaagent:/otel/opentelemetry-javaagent.jar"
otel:
  serviceName: docmind
  endpoint: http://otel-collector.observability:4318
  agentImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.15.0
probes:
  readiness: { path: /actuator/health/readiness, initialDelaySeconds: 15, periodSeconds: 5 }
  liveness:  { path: /actuator/health/liveness,  initialDelaySeconds: 40, periodSeconds: 10 }
terminationGracePeriodSeconds: 35
ingress:
  host: docmind.<도메인>
  clusterIssuer: letsencrypt-prod
  tls: false                         # true = cert-manager 가 인증서 발급(Traefik 이 80/443 직접 노출할 때). false = 앞단 프록시가 TLS 종료
env:
  DB_URL: jdbc:postgresql://pgvector.docmind:5432/docmind
  DB_USER: docmind
  OLLAMA_URL: http://ollama.docmind:11434
  OLLAMA_CHAT_MODEL: gemma3:1b          # 8GB 공유 서버·CPU 기준. GPU/메모리가 있으면 gemma3:4b
  OLLAMA_EMBED_MODEL: bge-m3
existingSecret: docmind-secrets      # DB_PASSWORD + OPENAI_API_KEY 또는 ANTHROPIC_API_KEY — 서버에서 kubectl create secret
ollama:
  enabled: true                        # profile=private 일 때만 필요. public/claude 로 바꾸면 false
  image: ollama/ollama:latest
  models: ["bge-m3", "gemma3:1b"]
  storage: 8Gi
  resources:
    requests: { cpu: 500m, memory: 1.5Gi }
    limits:   { cpu: "3",  memory: 3Gi }
postgres:
  enabled: true
  image: pgvector/pgvector:pg17
  storage: 10Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 384Mi }
