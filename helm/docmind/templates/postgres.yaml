{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata: { name: pgvector }
spec:
  selector: { app: pgvector }
  ports: [{ port: 5432 }]
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: pgvector }
spec:
  serviceName: pgvector
  replicas: 1
  selector: { matchLabels: { app: pgvector } }
  template:
    metadata: { labels: { app: pgvector } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: docmind }
            - { name: POSTGRES_USER, value: {{ .Values.env.DB_USER | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DB_PASSWORD } }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.env.DB_USER | quote }}] }
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.postgres.storage }} } }
{{- end }}
