# OpenTelemetry Collector — 앱(OTel Java agent)에서 OTLP 수신 → Tempo(트레이스) / Prometheus(메트릭) / Loki(로그)
receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
      grpc: { endpoint: 0.0.0.0:4317 }
processors:
  batch: {}
  memory_limiter: { check_interval: 1s, limit_mib: 256 }
  resource:
    attributes: [{ key: deployment.environment, value: homelab, action: upsert }]
exporters:
  otlp/tempo:
    endpoint: tempo.observability:4317
    tls: { insecure: true }
  prometheusremotewrite:
    endpoint: http://kube-prometheus-stack-prometheus.observability:9090/api/v1/write
  otlphttp/loki:
    endpoint: http://loki.observability:3100/otlp
service:
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlp/tempo] }
    metrics: { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [prometheusremotewrite] }
    logs:    { receivers: [otlp], processors: [memory_limiter, resource, batch], exporters: [otlphttp/loki] }
